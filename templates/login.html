<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Write Guard — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
<section class="card">
  <h2>Write Guard <small>v{{ version }}</small></h2>
  {% if error %}<p class="attr-bad">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Password: <input type="password" name="password" autofocus></label><br><br>
    <button type="submit">Log in</button>
  </form>
</section>
</main>
</body>
</html>
